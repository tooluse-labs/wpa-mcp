name: release

# Tag pushes (for example v0.2.8) publish a self-contained Windows executable.
# The web installers are intentionally thin: they download this asset and register
# it directly with MCP clients, with no user-machine .NET bootstrap.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/WprMcp/WprMcp.csproj -r win-x64

      - name: Publish self-contained win-x64 executable
        run: |
          dotnet publish src/WprMcp/WprMcp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item publish/win-x64/WprMcp.exe release/wpa-mcp-win-x64.exe
          .\release\wpa-mcp-win-x64.exe --version
          Get-ChildItem release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/wpa-mcp-win-x64.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
