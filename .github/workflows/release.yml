name: release

# Tag pushes (for example v0.2.8) publish a self-contained Windows executable
# plus the TraceEvent native DLLs required for Windows PDB/DIA symbol loading.
# The web installers are intentionally thin: they download this asset and
# register it directly with MCP clients, with no user-machine .NET bootstrap.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-wpamcp

      - name: Verify immutable release identity
        id: release_identity
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/WpaMcp/WpaMcp.csproj -Raw
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0].Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Project version '$version' is not a supported release version."
          }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expectedTag = "v$version"
            if ($env:GITHUB_REF_NAME -cne $expectedTag) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$expectedTag'."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore normal locked graph
        run: dotnet restore WpaMcp.sln --locked-mode

      - name: Restore locked win-x64 graph
        run: dotnet restore src/WpaMcp/WpaMcp.csproj -r win-x64 --locked-mode -p:NuGetLockFilePath=packages.win-x64.lock.json

      - name: Publish self-contained win-x64 executable
        run: |
          dotnet publish src/WpaMcp/WpaMcp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -o publish/win-x64

      - name: Validate immutable runtime rollout profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $profileJson = & .\publish\win-x64\WpaMcp.exe --runtime-profile
          if ($LASTEXITCODE -ne 0) {
            throw "Published host could not report its runtime profile."
          }
          $profile = $profileJson | ConvertFrom-Json
          $profileJson | Set-Content release/runtime-profile.v1.json -Encoding utf8
          $acceptedArtifactRisk = 'accepted_residual_risk:retained_quota_enforced;single_materialization_checkpoint_budget;opaque_converter_transient_peak_not_hard_limited'

          if ($profile.schemaVersion -cne 'runtime-profile.v1' -or
              $profile.runtimeVersion -cne '${{ steps.release_identity.outputs.version }}' -or
              $profile.selectionScope -cne 'startup_immutable' -or
              $profile.contractMode -cne '2.0' -or
              $profile.traceReferenceMode -cne 'id_only' -or
              -not $profile.runnable -or
              $profile.contractModeExplicit -or
              $profile.traceReferenceModeExplicit -or
              (@($profile.warnings) -cnotcontains $acceptedArtifactRisk)) {
            throw "Published runtime profile does not match the immutable release identity/default profile."
          }

          $null = & .\publish\win-x64\WpaMcp.exe --validate-release-profile
          if ($LASTEXITCODE -ne 0 -or $profile.releaseStatus -cne 'eligible') {
            $blockers = $profile.releaseBlockers -join '; '
            throw "ADR 0005 runtime rollout gate blocked this release: $blockers"
          }

      - name: Test exact published package over stdio
        shell: pwsh
        env:
          WPAMCP_RELEASE_REQUIRED: '1'
          WPAMCP_RELEASE_SERVER_PATH: ${{ github.workspace }}\publish\win-x64\WpaMcp.exe
          WPAMCP_RELEASE_EVIDENCE_PATH: ${{ github.workspace }}\release\release-package-stdio.v1.json
        run: dotnet test tests/WpaMcp.Tests/WpaMcp.Tests.csproj -c Release --no-restore -m:1 -nr:false --filter "Category=Package"

      - name: Validate external release evidence gates
        shell: pwsh
        run: |
          $required = @(
            'tests/WpaMcp.Tests/ContractBaselines/active-tools.v1.json',
            'tests/WpaMcp.Tests/ContractBaselines/active-dto-inventory.v1.json',
            'tests/WpaMcp.Tests/ContractBaselines/active-structured-stdio.v1.json',
            'eng/contract-baselines/tool-list-payload-budget.v1.json',
            'eng/contract-baselines/tools-list-pagination.v1.json',
            'eng/contract-baselines/tool-output-contract-registry.v1.json',
            'eng/contract-baselines/pre-resource-output-schema-hashes.v1.json',
            'eng/contract-baselines/artifact-materialization-budget.v1.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release evidence is missing: $path"
            }
          }

          $registry = Get-Content eng/contract-baselines/tool-output-contract-registry.v1.json -Raw | ConvertFrom-Json
          $registryTools = @($registry.tools)
          if ($registry.formatVersion -cne 'tool-output-contract-registry.v1' -or
              [int]$registry.toolCount -lt 1 -or
              $registryTools.Count -ne [int]$registry.toolCount -or
              $registry.registrySha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Complete output-contract registry metadata is invalid.'
          }

          $registryNames = @($registryTools | ForEach-Object { [string]$_.toolName })
          $uniqueRegistryNames = @($registryNames | Sort-Object -Unique)
          if ($uniqueRegistryNames.Count -ne $registryTools.Count) {
            throw 'Complete output-contract registry contains duplicate tool names.'
          }

          [long]$registryUtf8Bytes = 0
          foreach ($tool in $registryTools) {
            if ([string]::IsNullOrWhiteSpace([string]$tool.toolName) -or
                [string]::IsNullOrWhiteSpace([string]$tool.contractVersion) -or
                [string]::IsNullOrWhiteSpace([string]$tool.schemaDialect) -or
                [string]::IsNullOrWhiteSpace([string]$tool.mediaType) -or
                $tool.sha256 -cnotmatch '^[0-9a-f]{64}$' -or
                [long]$tool.utf8Bytes -le 0) {
              throw "Invalid output-contract descriptor for '$($tool.toolName)'."
            }

            $expectedUri = "wpa://contracts/tools/$($tool.toolName)/$($tool.sha256)"
            if ($tool.schemaUri -cne $expectedUri) {
              throw "Output-contract content address does not close for '$($tool.toolName)'."
            }

            $registryUtf8Bytes += [long]$tool.utf8Bytes
          }
          if ($registryUtf8Bytes -ne [long]$registry.totalCanonicalUtf8Bytes) {
            throw 'Complete output-contract registry aggregate byte count does not close.'
          }

          $artifact = Get-Content eng/contract-baselines/artifact-materialization-budget.v1.json -Raw | ConvertFrom-Json
          if ($artifact.schemaVersion -cne 'artifact-materialization-budget.v1' -or
              $artifact.status -cne 'accepted_residual_risk' -or
              $artifact.releaseDisposition -cne 'non_blocking_until_superseded' -or
              $artifact.riskCode -cne 'accepted_residual_risk:retained_quota_enforced;single_materialization_checkpoint_budget;opaque_converter_transient_peak_not_hard_limited' -or
              [string]::IsNullOrWhiteSpace([string]$artifact.decisionSource) -or
              -not $artifact.retainedArtifactQuotaEnforced -or
              -not $artifact.singleMaterializationCheckpointBudgetEnforced -or
              $artifact.opaqueConverterTransientPeakProven -or
              $artifact.wholeRootPhysicalPeakHardLimited) {
            throw 'Opaque converter residual-risk acceptance evidence is invalid or overclaims a hard physical peak bound.'
          }

      - name: Verify package evidence uses the gated default profile
        shell: pwsh
        run: |
          $profile = Get-Content release/runtime-profile.v1.json -Raw | ConvertFrom-Json
          $package = Get-Content release/release-package-stdio.v1.json -Raw | ConvertFrom-Json
          $registry = Get-Content eng/contract-baselines/tool-output-contract-registry.v1.json -Raw | ConvertFrom-Json
          if ($package.commit -cne '${{ github.sha }}' -or
              $package.runtimeVersion -cne $profile.runtimeVersion -or
              $package.contractMode -cne $profile.contractMode -or
              $package.traceReferenceMode -cne $profile.traceReferenceMode -or
              $package.runtimeProfileReleaseStatus -cne $profile.releaseStatus -or
              [int]$package.outputContractCount -ne [int]$registry.toolCount -or
              [long]$package.outputContractCanonicalBytes -ne [long]$registry.totalCanonicalUtf8Bytes) {
            throw "Package stdio evidence, runtime profile, version, or commit do not match."
          }

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          New-Item -ItemType Directory -Path release/root/bin -Force | Out-Null
          New-Item -ItemType Directory -Path release/root/native/amd64 -Force | Out-Null
          Copy-Item publish/win-x64/WpaMcp.exe release/root/bin/wpa-mcp.exe
          Copy-Item publish/win-x64/amd64/*.dll release/root/native/amd64/
          Compress-Archive -Path release/root/* -DestinationPath release/wpa-mcp-win-x64.zip -Force

          # Keep the historical single-exe asset for manual users and older installers.
          Copy-Item publish/win-x64/WpaMcp.exe release/wpa-mcp-win-x64.exe
          $reportedVersion = .\release\root\bin\wpa-mcp.exe --version
          $expectedVersion = 'WpaMcp ${{ steps.release_identity.outputs.version }}'
          if ($reportedVersion -cne $expectedVersion) {
            throw "Published host reported '$reportedVersion'; expected '$expectedVersion'."
          }
          Get-ChildItem release/

      - name: Record immutable release evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            schemaVersion = 'release-evidence.v1'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            version = '${{ steps.release_identity.outputs.version }}'
            capabilityManifestSha256 = (Get-FileHash eng/capabilities.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            toolContractManifestSha256 = (Get-FileHash eng/tool-contracts.v2.json -Algorithm SHA256).Hash.ToLowerInvariant()
            activeToolSnapshotSha256 = (Get-FileHash tests/WpaMcp.Tests/ContractBaselines/active-tools.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            activeDtoSnapshotSha256 = (Get-FileHash tests/WpaMcp.Tests/ContractBaselines/active-dto-inventory.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            activeStdioSnapshotSha256 = (Get-FileHash tests/WpaMcp.Tests/ContractBaselines/active-structured-stdio.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            toolListPayloadBudgetSha256 = (Get-FileHash eng/contract-baselines/tool-list-payload-budget.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            toolsListPaginationSha256 = (Get-FileHash eng/contract-baselines/tools-list-pagination.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            toolOutputContractRegistrySha256 = (Get-FileHash eng/contract-baselines/tool-output-contract-registry.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            preResourceOutputSchemaHashesSha256 = (Get-FileHash eng/contract-baselines/pre-resource-output-schema-hashes.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            artifactMaterializationBudgetSha256 = (Get-FileHash eng/contract-baselines/artifact-materialization-budget.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            runtimeProfileSha256 = (Get-FileHash release/runtime-profile.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            capabilityContractDesignSha256 = (Get-FileHash docs/MCP_CAPABILITY_MAP_AND_CONTRACT_REFACTORING.zh-CN.md -Algorithm SHA256).Hash.ToLowerInvariant()
            packageStdioEvidenceSha256 = (Get-FileHash release/release-package-stdio.v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
            assets = [ordered]@{
              executableSha256 = (Get-FileHash release/wpa-mcp-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
              zipSha256 = (Get-FileHash release/wpa-mcp-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content release/release-evidence.v1.json -Encoding utf8

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # softprops/action-gh-release@v2
        with:
          files: |
            release/wpa-mcp-win-x64.zip
            release/wpa-mcp-win-x64.exe
            release/release-package-stdio.v1.json
            release/runtime-profile.v1.json
            release/release-evidence.v1.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
