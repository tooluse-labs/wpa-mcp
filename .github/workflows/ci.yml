name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WprMcp.sln

      - name: Build
        run: dotnet build WprMcp.sln -c Release --no-restore

      - name: Test
        run: dotnet test WprMcp.sln -c Release --no-build
