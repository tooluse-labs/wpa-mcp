<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">wpa-mcp</title>
  <desc id="desc">A four-row flame graph in a cool-to-warm palette (cyan, teal, amber).  Linear/Stripe-style light variant.</desc>

  <!-- Light tile with hairline border for definition on white pages -->
  <rect width="256" height="256" rx="0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Flame graph: 4 rows in a cool-to-warm progression, mirrored on x=128.
       Solid colors per row (rather than a gradient) keep cyan→teal→amber
       crisp; linear interpolation between teal and amber would otherwise
       pass through a muddy olive. -->
  <rect x="28"  y="164" width="200" height="24" rx="3" fill="#06B6D4"/>
  <rect x="28"  y="132" width="92"  height="24" rx="3" fill="#14B8A6"/>
  <rect x="136" y="132" width="92"  height="24" rx="3" fill="#14B8A6"/>
  <rect x="28"  y="100" width="40"  height="24" rx="3" fill="#FBBF24"/>
  <rect x="80"  y="100" width="32"  height="24" rx="3" fill="#FBBF24"/>
  <rect x="144" y="100" width="32"  height="24" rx="3" fill="#FBBF24"/>
  <rect x="188" y="100" width="40"  height="24" rx="3" fill="#FBBF24"/>
  <rect x="36"  y="68"  width="24"  height="24" rx="3" fill="#F59E0B"/>
  <rect x="196" y="68"  width="24"  height="24" rx="3" fill="#F59E0B"/>
</svg>
