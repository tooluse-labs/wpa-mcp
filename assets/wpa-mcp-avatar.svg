<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="title desc">
  <title id="title">wpa-mcp avatar mark</title>
  <desc id="desc">Square avatar variant of the wpa-mcp mark with normalized canvas padding for small profile lists.</desc>

  <defs>
    <linearGradient id="markFill" x1="45" y1="39" x2="275" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="traceStroke" x1="123" y1="160" x2="188" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="30" y="30" width="260" height="260" rx="56" fill="url(#markFill)"/>

    <path d="M78 82V238M130 60V260M182 60V260M234 82V238" stroke="#1E293B" stroke-width="2.25"/>

    <path d="M65 134H102L123 212L156 108L188 212L210 134H253" fill="none" stroke="url(#traceStroke)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="123" cy="212" r="6.5" fill="#FFFFFF"/>
    <circle cx="123" cy="212" r="16" fill="none" stroke="#4CC9F0" stroke-width="3.75" opacity="0.8"/>
    <circle cx="156" cy="108" r="6.5" fill="#FFFFFF"/>
    <circle cx="156" cy="108" r="16" fill="none" stroke="#2DD4BF" stroke-width="3.75" opacity="0.8"/>
    <circle cx="188" cy="212" r="6.5" fill="#FFFFFF"/>
    <circle cx="188" cy="212" r="16" fill="none" stroke="#F59E0B" stroke-width="3.75" opacity="0.8"/>
  </g>
</svg>
