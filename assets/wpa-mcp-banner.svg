<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">wpa-mcp banner</title>
  <desc id="desc">wpa-mcp README hero banner (1280x320, 4:1): kernel-event trace mark in cyan/teal/amber on the left, alongside the wpa-mcp wordmark, tagline, and three brand-colour bars.</desc>

  <defs>
    <linearGradient id="markFill" x1="54" y1="48" x2="266" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="traceStroke" x1="126" y1="160" x2="186" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Full-canvas tile, theme-independent -->
  <rect width="1280" height="320" rx="40" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Mark: original 240×240 at (40, 40) → (280, 280); vertical centre
       y=160 = canvas centre.  No scale transform — banner height (320) is
       chosen to fit the mark at design size with 40px top/bottom padding. -->
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="240" height="240" rx="52" fill="url(#markFill)"/>
    <path d="M84 88V232M132 68V252M180 68V252M228 88V232" stroke="#1E293B" stroke-width="2"/>
    <path d="M72 136H106L126 208L156 112L186 208L206 136H246" fill="none" stroke="url(#traceStroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="126" cy="208" r="15" fill="none" stroke="#4CC9F0" stroke-width="3.5" opacity="0.8"/>
    <circle cx="156" cy="112" r="6" fill="#FFFFFF"/>
    <circle cx="156" cy="112" r="15" fill="none" stroke="#2DD4BF" stroke-width="3.5" opacity="0.8"/>
    <circle cx="186" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="186" cy="208" r="15" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.8"/>
  </g>

  <!-- Subtle separator -->
  <line x1="320" y1="80" x2="320" y2="240" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Wordmark.  Font-size 100 (1.28× lockup's 78); dash sized
       proportionally (36×10).  Wordmark + tagline + bars block geometric
       centre = canvas centre y=160. -->
  <text x="720" y="126" text-anchor="end" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="100" font-weight="750">wpa</text>
  <rect x="734" y="96" width="36" height="10" rx="5" fill="#64748B"/>
  <text x="784" y="126" text-anchor="start" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="100" font-weight="750">mcp</text>

  <!-- Tagline (font-size 32, ≈ 1.07× lockup's 30) -->
  <text x="527" y="195" fill="#475569" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="500">ETW trace analysis for MCP clients</text>

  <!-- Three brand-colour bars (80×11 each, gap 16; ≈ 1.5× lockup's 54×8) -->
  <rect x="527" y="234" width="80" height="11" rx="5" fill="#4CC9F0"/>
  <rect x="623" y="234" width="80" height="11" rx="5" fill="#2DD4BF"/>
  <rect x="719" y="234" width="80" height="11" rx="5" fill="#F59E0B"/>
</svg>
