<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="title desc">
  <title id="title">wpa-mcp logo</title>
  <desc id="desc">A dark rounded mark with an .etl trace waveform across a kernel-event timeline grid, with cyan / teal / amber markers at the trace's three folding points.</desc>
  <defs>
    <linearGradient id="markFill" x1="54" y1="48" x2="266" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="traceStroke" x1="126" y1="160" x2="186" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#0B1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Full-canvas tile so the lockup renders identically on light and dark
       README backgrounds; 1px hairline border defines the card on white. -->
  <rect width="880" height="320" rx="40" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <g filter="url(#softShadow)" transform="translate(160 160) scale(0.9) translate(-160 -160)">
    <rect x="40" y="40" width="240" height="240" rx="52" fill="url(#markFill)"/>
    <path d="M84 88V232M132 68V252M180 68V252M228 88V232" stroke="#1E293B" stroke-width="2"/>
    <path d="M72 136H106L126 208L156 112L186 208L206 136H246" fill="none" stroke="url(#traceStroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vertex markers at the polyline's three folding points; colours
         echo the brand bars under the tagline (cyan / teal / amber). -->
    <circle cx="126" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="126" cy="208" r="15" fill="none" stroke="#4CC9F0" stroke-width="3.5" opacity="0.8"/>
    <circle cx="156" cy="112" r="6" fill="#FFFFFF"/>
    <circle cx="156" cy="112" r="15" fill="none" stroke="#2DD4BF" stroke-width="3.5" opacity="0.8"/>
    <circle cx="186" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="186" cy="208" r="15" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.8"/>
  </g>

  <!-- Subtle separator splitting the mark from the wordmark / tagline. -->
  <line x1="300" y1="108" x2="300" y2="212" stroke="#E2E8F0" stroke-width="2"/>

  <g aria-label="wpa-mcp">
    <text x="480" y="145" text-anchor="end" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="750" letter-spacing="0">wpa</text>
    <rect x="490" y="121" width="28" height="8" rx="4" fill="#64748B"/>
    <text x="528" y="145" text-anchor="start" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="78" font-weight="750" letter-spacing="0">mcp</text>
    <text x="337" y="196" fill="#475569" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="0">ETW trace analysis for MCP clients</text>
    <rect x="336" y="219" width="54" height="8" rx="4" fill="#4CC9F0"/>
    <rect x="400" y="219" width="54" height="8" rx="4" fill="#2DD4BF"/>
    <rect x="464" y="219" width="54" height="8" rx="4" fill="#F59E0B"/>
  </g>
</svg>
