<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">wpa-mcp</title>
  <desc id="desc">wpa-mcp social preview (1280x640, GitHub spec): kernel-event trace mark in cyan/teal/amber, alongside the wpa-mcp wordmark, tagline, and three brand-colour bars.</desc>

  <defs>
    <linearGradient id="markFill" x1="54" y1="48" x2="266" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="traceStroke" x1="126" y1="160" x2="186" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4CC9F0"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0B1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Tile spans full canvas so it renders identically on light and dark
       backgrounds (Twitter / Discord / GitHub social card embeds). -->
  <rect width="1280" height="640" rx="60" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Mark: scaled 5/3 around badge top-left (40,40) → canvas (80,120),
       so the 240×240 badge becomes 400×400 from (80,120) to (480,520).
       Mark vertical centre = canvas vertical centre y=320. -->
  <g filter="url(#softShadow)" transform="translate(80 120) scale(1.6667) translate(-40 -40)">
    <rect x="40" y="40" width="240" height="240" rx="52" fill="url(#markFill)"/>
    <path d="M84 88V232M132 68V252M180 68V252M228 88V232" stroke="#1E293B" stroke-width="2"/>
    <path d="M72 136H106L126 208L156 112L186 208L206 136H246" fill="none" stroke="url(#traceStroke)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="126" cy="208" r="15" fill="none" stroke="#4CC9F0" stroke-width="3.5" opacity="0.8"/>
    <circle cx="156" cy="112" r="6" fill="#FFFFFF"/>
    <circle cx="156" cy="112" r="15" fill="none" stroke="#2DD4BF" stroke-width="3.5" opacity="0.8"/>
    <circle cx="186" cy="208" r="6" fill="#FFFFFF"/>
    <circle cx="186" cy="208" r="15" fill="none" stroke="#F59E0B" stroke-width="3.5" opacity="0.8"/>
  </g>

  <!-- Subtle separator -->
  <line x1="540" y1="180" x2="540" y2="460" stroke="#E2E8F0" stroke-width="3"/>

  <!-- Wordmark.  Font-size 130 (≈ 5/3 of lockup's 78); dash sized
       proportionally (46×12, was 28×8); dash centred on wordmark's
       x-height middle y≈246. -->
  <text x="875" y="281" text-anchor="end" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="130" font-weight="750">wpa</text>
  <rect x="890" y="242" width="46" height="12" rx="6" fill="#64748B"/>
  <text x="951" y="281" text-anchor="start" fill="#0F172A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="130" font-weight="750">mcp</text>

  <!-- Tagline (font-size 36, sized to fit canvas width with margin even
       when browser falls back to Arial; was 50 which overflowed by ~165px). -->
  <text x="620" y="364" fill="#475569" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="36" font-weight="500">ETW trace analysis for MCP clients</text>

  <!-- Three brand-colour bars (120×14 each, 16 gap; ≈ 2.2× lockup's 54×8) -->
  <rect x="620" y="410" width="120" height="14" rx="7" fill="#4CC9F0"/>
  <rect x="756" y="410" width="120" height="14" rx="7" fill="#2DD4BF"/>
  <rect x="892" y="410" width="120" height="14" rx="7" fill="#F59E0B"/>
</svg>
